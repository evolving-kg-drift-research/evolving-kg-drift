[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evolving-kg-pipeline"
version = "0.1.0"
description = "Immutable, evidence-first Data/KG pipeline tooling"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.15.0",
  "pyarrow==25.0.1",
  "PyYAML==6.0.3",
  "openai>=1.0.0",
]

[project.scripts]
kg-pipeline = "kg_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
