      - tests/scientific/test_temporal_axis_separation.py
    status: RESOLVED
    fixed_by_commit: "feat(A07): decouple world validity, evidence observation, and ingestion time axes"
    evidence: "valid_from strictly decoupled from evidence_observed_at; unproven observation routes to EVIDENCE_TIME_UNAVAILABLE"

