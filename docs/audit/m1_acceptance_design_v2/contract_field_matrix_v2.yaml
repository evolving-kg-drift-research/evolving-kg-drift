additional_contract_work:
  cross_table_rules:
  - Object entity or literal must match ontology; no automatic literal-to-entity conversion.
  - Corpus/document cluster identities need explicit parent membership joins; no invented
    scalar alias for a composite key.
  - candidate/supporting_claim_ids reference every claims row; collection FK validation
    must be explicit.
  - Entity IDs reference the proposed entity registry; mapping availability has independent
    evidence.
  - SourceClaim/support events retain full provenance and append-only history.
  required_new_tables:
  - source_claims
  - support_events
  - entity_registry
  - temporal_evidence
  runtime_auxiliary_tables_to_register:
  - coverage_ledger
  - extracted_claims
  - lineage_edges
  - missing_coverage_ledger
  - near_duplicate_candidates
  - provenance_recovery_ledger
  - raw_hash_audit
  - raw_inventory
  status: DRAFT_DESIGN_REQUIRES_REVIEW; not a loadable runtime schema
