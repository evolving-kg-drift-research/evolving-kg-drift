# config/schema.yaml
# Schema dữ liệu dùng xuyên suốt Data/KG pipeline.
# Nếu thay đổi semantics/field quan trọng sau khi freeze:
# bump version và reprocess upstream theo protocol.

schema_version: "1.0.0"

# =========================================================
# 1. SOURCE REGISTRY
# =========================================================
source_registry:
  fields:
    - source_id
    - name
    - domain
    - source_type
    - rss
    - enabled
    - trust_notes
    - archive_availability
    - robots_legal_notes

# =========================================================
# 2. RAW SOURCE VERSION
# =========================================================
raw_source_versions:
  fields:
    - raw_source_id
    - source_id
    - url
    - content_hash_sha256
    - retrieved_at_real
    - published_at_declared
    - updated_at_declared
    - archive_or_revision_datetime
    - source_version_relation
    - raw_blob_path

retrievals:
  fields:
    - retrieval_id
    - raw_blob_sha256
    - source_id
    - requested_url
    - final_url
    - retrieved_at_real
    - archive_datetime
    - recorded_event_at
    - recorded_event_time_field
    - provenance_status
    - strict_source_input_eligible
    - evidence_path
    - evidence_locator
    - evidence_file_sha256
    - evidence_record_sha256

source_versions:
  fields:
    - source_version_id
    - raw_blob_sha256
    - retrieval_id
    - source_id
    - canonical_or_final_url
    - retrieved_at_real
    - archive_datetime
    - source_version_status
    - strict_source_input_eligible
    - evidence_path
    - evidence_locator

body_variants:
  fields:
    - body_variant_id
    - body_text_sha256
    - body_blob_relative_path
    - parser_version
    - parser_fingerprint_sha256
    - decoder
    - selector
    - text_char_count
    - extraction_status
    - quality_flags_json

# =========================================================
# 3. DOCUMENT CLUSTER / SOURCE LINEAGE
# =========================================================
document_clusters:
  fields:
    - document_cluster_id
    - raw_source_id
    - duplicate_cluster_id
    - canonical_document_id
    - source_lineage_group_id
    - is_syndicated_copy
    - dedup_method
    - dedup_score
    - algorithm_version

# =========================================================
# 4. CORPUS FILTER
# =========================================================
corpus_filtered:
  fields:
    - document_cluster_id
    - filter_decision
    - reason_code
    - filter_version

# =========================================================
# 5. ENTITY MENTION + VERSIONED ENTITY MAPPING
# =========================================================
entity_mentions:
  fields:
    - mention_id
    - raw_source_id
    - span_start
    - span_end
    - raw_form
    - normalized_mention

entity_mapping_versions:
  fields:
    - entity_mapping_id
    - mention_id
    - canonical_entity_id
    - mapping_available_at
    - entity_map_version
    - supersedes_mapping_id
    - mapping_basis
    - mapping_confidence

# =========================================================
# 6. CLAIM
# =========================================================
claims:
  fields:
    - claim_id
    - raw_source_id
    - subject_id
    - relation_id
    - object_id
    - object_value
    - scope

    - evidence_span_start
    - evidence_span_end
    - evidence_text_hash

    - valid_from
    - valid_to
    - evidence_observed_at
    - evidence_time_basis
    - evidence_time_confidence
    - valid_from_inferred

    - extractor_version
    - ontology_version
    - extraction_confidence

# =========================================================
# 7. DOCUMENT MEMBERSHIP
# =========================================================
document_memberships:
  fields:
    - membership_id
    - raw_blob_sha256
    - raw_candidate_id
    - body_variant_id
    - exact_cluster_id
    - retrieval_ids_json
    - source_provenance_status
    - strict_input_eligible
    - membership_status
    - reason

# =========================================================
# 8. ADJUDICATION
# =========================================================
adjudication_decisions:
  fields:
    - decision_id
    - LogicalFactID
    - candidate_claim_ids
    - supporting_claim_ids
    - decision
    - acceptance_basis
    - accepted_into_kg_at
    - adjudicated_at_real
    - adjudication_rule_version
    - reviewer_provenance

# =========================================================
# 8. FACT VERSION STORE
# =========================================================
fact_versions:
  fields:
    - FactVersionID
    - LogicalFactID

    - subject_id
    - relation_id
    - object_id
    - object_value
    - scope

    - valid_from
    - valid_to
    - evidence_observed_at
    - accepted_into_kg_at

    - retrieved_at_real
    - adjudicated_at_real

    - supersedes_version_id
    - revision_type

    - source_id
    - url
    - raw_source_id
    - supporting_claim_ids

    - extractor_version
    - entity_map_version
    - ontology_version
    - adjudication_rule_version

    - confidence
    - adjudication_status

# =========================================================
# 9. CLAIM PROVENANCE
# =========================================================
claim_provenance:
  fields:
    - provenance_id
    - claim_id
    - membership_id
    - source_version_id
    - retrieval_id
    - raw_blob_sha256
    - publisher_source_id
    - source_url

# =========================================================
# 10. SNAPSHOT EDGES (UNIQUE TRIPLES)
# =========================================================
snapshot_edges:
  fields:
    - edge_id
    - subject_id
    - relation_id
    - object_id
    - snapshot_id

# =========================================================
# 11. SNAPSHOT EDGE SUPPORT (PROVENANCE MULTIPLICITY)
# =========================================================
snapshot_edge_support:
  fields:
    - support_id
    - provenance_id
    - edge_id
    - fact_version_id
    - claim_id
    - source_version_id
    - raw_blob_sha256

# =========================================================
# 12. SNAPSHOT EXCLUSIONS (FAIL-CLOSED QUARANTINE)
# =========================================================
snapshot_exclusions:
  fields:
    - exclusion_id
    - record_id
    - fact_version_id
    - reason_code
    - severity
    - stage
    - field
    - detail