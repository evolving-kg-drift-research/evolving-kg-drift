  unavailable: null_with_reason_no_nan_or_inf
drift:
  raw_metric: one_minus_cosine_after_centered_alignment
  temporal_aggregation: median_three_parallel_seeds
  signed_excess: temporal_displacement_minus_LTO_null_median
  SED_plus: max_zero_signed_excess_divided_by_1.4826_MAD_plus_epsilon
